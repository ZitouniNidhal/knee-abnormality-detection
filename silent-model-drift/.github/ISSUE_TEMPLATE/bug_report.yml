name: Bug report
description: Report a reproducible problem without sharing secrets or sensitive output.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, tokens, sensitive prompts, or raw model output."
  - type: input
    id: version
    attributes:
      label: Package and Python version
      placeholder: "silent-model-drift 0.1.0; Python 3.12"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sanitized command and expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

